<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern to-do list application to manage your daily tasks">
    <meta name="author" content="Your Name">
    <title>To-Do List App</title>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Header Section -->
        <h1>✓ My Tasks</h1>
        
        <!-- Statistics Display -->
        <div class="stats">
            <span id="totalTasks">0</span> total · 
            <span id="activeTasks">0</span> active · 
            <span id="completedTasks">0</span> completed
        </div>

        <!-- Task Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="What needs to be done?"
                autocomplete="off"
                aria-label="New task input"
            >
            <button id="addBtn" aria-label="Add new task">Add</button>
        </div>

        <!-- Filter Buttons -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <ul id="taskList" role="list"></ul>

        <!-- Clear Completed Section (hidden by default) -->
        <div class="clear-completed" id="clearSection" style="display: none;">
            <button id="clearCompletedBtn">Clear Completed</button>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
